services:
  # ── PostgreSQL Database ──
  - type: pserv
    name: phishguard-db
    env: docker
    plan: free

  # ── Redis Cache ──
  - type: redis
    name: phishguard-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # ── FastAPI Backend ──
  - type: web
    name: phishguard-backend
    env: docker
    plan: free
    rootDir: backend
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: phishguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: phishguard-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: phishguard-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: phishguard-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'



  # ── React Frontend (Static Site) ──
  - type: web
    name: phishguard-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://phishguard-backend.onrender.com
